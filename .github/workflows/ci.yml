name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix build, lint and plugin proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Build packages (shellcheck runs inside the builds)
        run: nix build --no-link .#gamechat_mix .#gamechat_balance .#dms_plugin

      - name: Flake check
        run: nix flake check

      - name: shfmt
        run: >
          nix develop -c shfmt -d dms/gamechat_mix.sh dms/gamechat_balance.sh
          standalone/install.sh tests/test_helper.bash tests/fixtures/*.sh

      - name: nixfmt
        run: |
          nix develop -c nixfmt flake.nix nix/gamechat_mix.nix nix/gamechat_balance.nix nix/dms_plugin.nix
          git diff --exit-code

      - name: Plugin bake proof
        run: |
          out=$(nix build --no-link --print-out-paths .#dms_plugin)
          daemon=$(nix build --no-link --print-out-paths .#gamechat_mix)
          nix path-info -r "$out" | grep -Fx "$daemon"
          grep -Fq "$daemon/bin/gamechat_mix" "$out/GameChatMixDaemon.qml"
          if grep -q '@gamechat_mix@' "$out/GameChatMixDaemon.qml"; then
            echo "unsubstituted @gamechat_mix@ placeholder left in the built QML" >&2
            exit 1
          fi
          grep -Fq 'gamechat_mix.sh' "$out/GameChatMixDaemon.qml"
          test -x "$out/gamechat_mix.sh"
          test -x "$out/gamechat_balance.sh"
          cmp dms/internal/qmldir "$out/internal/qmldir"
          cmp dms/internal/GameChatState.qml "$out/internal/GameChatState.qml"

  e2e:
    name: PipeWire end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      - name: Run e2e suite (hermetic PipeWire sessions)
        run: nix develop -c bats tests/

      - name: Upload session logs
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: gcm-session-logs
          path: /tmp/gcm-e2e-logs-*/
          if-no-files-found: ignore
